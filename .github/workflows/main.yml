name: nixcfg CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate Configuration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v25
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Format Check (nixfmt-tree)
        run: nix run nixpkgs#nixfmt-tree -- --fail-on-change

      - name: Lint (statix)
        run: |
          nix run nixpkgs#statix -- check .

      - name: Dead Code Detection (deadnix)
        run: nix run nixpkgs#deadnix -- . -f

      - name: SOPS Secrets Validation
        run: |
          nix run nixpkgs#sops -- filestatus secrets/secrets.yaml

      - name: Flake Check
        run: |
          set -euo pipefail
          # `nix flake check` forces every nixosConfigurations.*.toplevel in a
          # single Nix process. On the 7 GB private-repo runner that OOMs and
          # kills the runner. Evaluate each output in its own invocation so peak
          # memory stays bounded; any evaluation error still fails the job.
          for p in recall deepseek-harness; do
            echo "::group::packages.x86_64-linux.$p"
            nix eval --raw ".#packages.x86_64-linux.$p.drvPath" >/dev/null
            echo "::endgroup::"
          done
          for h in $(nix eval --raw .#nixosConfigurations --apply 'a: builtins.concatStringsSep " " (builtins.attrNames a)'); do
            echo "::group::nixosConfigurations.$h"
            nix eval --raw ".#nixosConfigurations.$h.config.system.build.toplevel.drvPath" >/dev/null
            echo "::endgroup::"
          done
